 for(let i=0;i<n;i++){const a=R()*6.283,r1=m*(.32+R()*.2),r2=r1+m*(.15+R()*.25*r);fc.strokeStyle=`rgba(${nt?'150,230,255':'255,255,255'},${.1+R()*.25})`;fc.beginPath();fc.moveTo(w/2+Math.cos(a)*r1*1.4,h*.46+Math.sin(a)*r1);fc.lineTo(w/2+Math.cos(a)*r2*1.4,h*.46+Math.sin(a)*r2);fc.stroke()}}
function results(){mode='done';nitroOn=false;const P=pl,md=MODES[S.mode],

 const base=[1000,650,400,220,120,60][pos-1]*(1+.3*S.map)*md[3],par=L/(.8*pst.spd/3.6),tb=Math.max(0,(par-P.fin)*8),ld=pos==1?Math.min(600,(all[1].t-all[0].t)*60):0;
 const tk=[['Toza poyga (zarbasiz)',P.dmg<12,200,40],['3 ta botni quvib o‘tish',P.over>=3,150,30],['Rampadan sakrash',P.rp>0,100,25]];
 let money=base+tb+ld,xp=(50+[120,80,55,35,20,10][pos-1]+P.over*12+P.clean*2)*(1+.15*(md[3]-1));tk.forEach(x=>{if(x[1]){money+=x[2];xp+=x[3]}});money=Math.round(money);xp=Math.round(xp);
 S.money+=money;const ups=addXP(xp);sv();
 const row=(x,i)=>`<div class="rr${x.r===P?' me':''}"><b>${i+1}</b><span>${x.n}</span><em>${x.e?'~':''}${ft(x.t)}</em></div>`;
 let h=`<h2>${pos==1?'G‘ALABA!':pos+'-o‘rin'}</h2>`+all.slice(0,3).map(row).join('')+(pos>3?row(all[pos-1],pos-1):'')+
 `<div class=kv style="margin-top:10px"><span>Vaqt</span><b>${ft(P.fin)}</b></div><div class=kv><span>Maksimal tezlik</span><b>${Math.round(P.max)} km/h</b></div><div class=kv><span>Quvib o‘tilgan botlar</span><b>${P.over}</b></div>`+
 tk.map(x=>`<div class=kv><span>${x[1]?'✓':'✗'} ${x[0]}</span><span>${x[1]?'+$'+x[2]+' / +'+x[3]+' XP':'—'}</span></div>`).join('')+
 `<div class="kv g"><span>Olingan pul</span><b>+$${fmt(money)}</b></div><div class="kv g"><span>Olingan XP</span><b>+${xp}</b></div>`;
 ups.forEach(l=>h+=`<h5 style="color:var(--c2)">LEVEL ${l}! Ochildi:</h5>`+unlocks(l).map(x=>`<div class=kv>${x}</div>`).join(''));
 h+=`<div class=row style="margin-top:14px"><button class="bt pr" data-a="again">Yana poyga</button><button class=bt data-a="menu">Garajga</button></div>`;
 $('#rc').innerHTML=h;$('#hud').classList.remove('on');$('#res').classList.add('on');$('#vg').style.opacity=0;fc.clearRect(0,0,fx.width,fx.height)}
/* ---------- MENU / UI ---------- */

 snow.visible=false;clrP();nitroOn=false;['#hud','#res','#ps'].forEach(s=>$(s).classList.remove('on'));$('#menu').classList.add('on');$('#vg').style.opacity=0;fc.clearRect(0,0,fx.width,fx.height);cam.fov=45;cam.position.set(0,2.4,8);cam.lookAt(0,.7,0);showCar();render()}
function showCar(){if(mg.userData.car)mg.remove(mg.userData.car);const c=S.cars[S.sel],g=mk(CARS[S.sel][1],COL[c.c][1],c.t);mg.add(g);mg.userData.car=g}

const rCars=()=>CARS.map((c,i)=>{const o=S.cars[i],st=stats(i),lk=S.lv<c[3];let b;
 if(o)b=(S.sel==i?'<button class="bt pr" disabled>Tanlangan</button>':`<button class=bt data-a="sel:${i}">Tanlash</button>`)+(Object.keys(S.cars).length>1?`<button class=bt data-a="sell:${i}">Sotish $${fmt(sellV(i))}</button>`:'');
 else b=lk?`<button class=bt disabled>Level ${c[3]} kerak</button>`:`<button class="bt pr" data-a="buy:${i}" ${S.money<c[2]?'disabled':''}>Sotib olish $${fmt(c[2])}</button>`;
 return `<div class="cd${S.sel==i?' sl':''}"><h4>${c[0]}<small>${CLS[c[1]]}</small></h4>${bars(st)}<small>${c[8]} kg, kuch ${pw(st)}</small><div class=row>${b}</div></div>`}).join('');
const rUp=()=>{const c=S.cars[S.sel],st=stats(S.sel),cap=Math.min(5,1+(S.lv/3|0));
 return `<div class=cd><h4>${CARS[S.sel][0]}<small>Kuch ${pw(st)}, nitro ${st.nit}</small></h4>${bars(st)}</div>`+UP.map((u,j)=>{const l=c.u[j],cost=ucost(j,l);
 const b=S.lv<u[2]?`<button class=bt disabled>Level ${u[2]} da ochiladi</button>`:l>=5?'<button class=bt disabled>MAX</button>':l>=cap?`<button class=bt disabled>Level ${3*l} kerak</button>`:`<button class="bt pr" data-a="upg:${j}" ${S.money<cost?'disabled':''}>Kuchaytirish $${fmt(cost)}</button>`;
 return `<div class=cd><h4>${u[0]}<small>${u[3]}</small></h4><div class=row><div class=pips>${[0,1,2,3,4].map(k=>`<u class="${k<l?'f':''}"></u>`).join('')}</div>${b}</div></div>`}).join('')};
const rTune=()=>{const c=S.cars[S.sel];return '<h5>Rang</h5><div class=sw>'+COL.map((x,j)=>`<button class="${c.c==j?'on':''}" style="background:${x[1]}" title="${x[0]}" data-a="col:${j}"></button>`).join('')+'</div>'+
 Object.entries(TN).map(([k,[n,op]])=>`<h5>${n}</h5><div class=ch>${op.map((o,j)=>`<button class="${(c.t[k]|0)==j?'on':''}" data-a="tn:${k}:${j}">${o[0]}${!o[1]||S.own[k+j]?'':' $'+fmt(o[1])}</button>`).join('')}</div>`).join('')};
const rMaps=()=>'<h5>Rejim</h5><div class=ch>'+MODES.map((m,i)=>`<button class="${S.mode==i?'on':''}" ${S.lv<m[2]?'disabled':''} data-a="mode:${i}">${m[0]} ${m[1]/1000} km${S.lv<m[2]?' (Lv '+m[2]+')':''}</button>`).join('')+'</div><h5>Yo‘llar</h5>'+
 MAPS.map((m,i)=>`<div class="cd${S.map==i?' sl':''}"><h4>${m.n}<small>Qiyinlik ${1+(i/2.5|0)}/5</small></h4><small>${m.ds}</small><div class=row>${S.lv<m.l?`<button class=bt disabled>Level ${m.l} kerak</button>`:S.map==i?'<button class="bt pr" disabled>Tanlangan</button>':`<button class=bt data-a="map:${i}">Tanlash</button>`}</div></div>`).join('');
function render(){const st=stats(S.sel),p=pw(st);
 $('#lv').textContent=S.lv;$('#xf').style.width=S.xp/XPN(S.lv)*100+'%';$('#xt').textContent=`XP ${S.xp}/${XPN(S.lv)}`;$('#mn').textContent='$ '+fmt(S.money);
 $('#sel').innerHTML=`${CARS[S.sel][0]}, ${CLS[CARS[S.sel][1]]}, kuch ${p}<br>Botlar kuchi: ${Math.round(p*.85)}–${Math.round(p*.95)}<br>${MAPS[S.map].n}, ${MODES[S.mode][0]}`;

function act(a){const [k,x,y]=a.split(':'),i=+x;
 if(k=='go')return startRace();if(k=='again')return startRace();if(k=='menu'||k=='qt')return toMenu();
 if(k=='pz'){if(mode=='race'||mode=='cd'){paused=true;$('#ps').classList.add('on')}return}if(k=='rs'){paused=false;$('#ps').classList.remove('on');return}
 if(k=='tab'){if(tab!=x)tab=x;else if(x=='tune'||1)tab=x}else if(k=='close')tab=null;
 else if(k=='buy'){const c=CARS[i];if(S.money>=c[2]&&S.lv>=c[3]){S.money-=c[2];S.cars[i]=nc();S.sel=i;showCar();toast(c[0]+' sotib olindi')}}
 else if(k=='sel'){S.sel=i;showCar()}
 else if(k=='sell'&&Object.keys(S.cars).length>1){S.money+=sellV(i);delete S.cars[i];if(S.sel==i)S.sel=+Object.keys(S.cars)[0];showCar()}
 else if(k=='upg'){const c=S.cars[S.sel],l=c.u[i],cost=ucost(i,l);if(S.money>=cost&&l<Math.min(5,1+(S.lv/3|0))&&S.lv>=UP[i][2]){S.money-=cost;c.u[i]++;toast(UP[i][0]+' '+c.u[i]+'-daraja')}}
 else if(k=='col'){S.cars[S.sel].c=i;showCar()}
 else if(k=='tn'){const j=+y,o=TN[x][1][j];if(o[1]&&!S.own[x+j]){if(S.money<o[1])return toast('Pul yetarli emas');S.money-=o[1];S.own[x+j]=1}S.cars[S.sel].t[x]=j;showCar()}
 else if(k=='map'&&S.lv>=MAPS[i].l)S.map=i;else if(k=='mode'&&S.lv>=MODES[i][2])S.mode=i;
 sv();render()}
